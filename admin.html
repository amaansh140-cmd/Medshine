<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Dashboard | Medshine Clinic</title>
    <link href="/src/style.css" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        theme: {
          extend: {
            colors: {
              cream: '#FDFBF7',
              creamdeep: '#F5F2EA',
              ink: '#065F46',
              inkmute: '#059669',
            },
            fontFamily: {
              serif: ['"Playfair Display"', 'serif'],
              sans: ['Inter', 'sans-serif'],
            }
          }
        }
      }
    </script>
</head>
<body class="bg-cream text-ink font-sans antialiased overflow-hidden">
    <!-- Login Screen -->
    <div id="login-screen" class="min-h-screen flex items-center justify-center bg-cream/50 backdrop-blur-sm z-50 relative">
        <div class="bg-white p-8 rounded-2xl shadow-xl border border-ink/10 w-full max-w-md">
            <h2 class="text-2xl font-serif font-semibold text-center mb-6">Admin Login</h2>
            <form id="login-form" class="space-y-4">
                <div>
                    <label class="block text-sm font-medium mb-1">Email</label>
                    <input type="email" id="email" required class="w-full px-4 py-2 rounded-lg border border-ink/20 focus:outline-none focus:border-ink bg-transparent">
                </div>
                <div>
                    <label class="block text-sm font-medium mb-1">Password</label>
                    <input type="password" id="password" required class="w-full px-4 py-2 rounded-lg border border-ink/20 focus:outline-none focus:border-ink bg-transparent">
                </div>
                <div id="login-error" class="text-red-500 text-sm hidden"></div>
                <button type="submit" class="w-full bg-ink text-white py-2 rounded-lg hover:bg-inkmute transition-colors font-medium">Log In</button>
            </form>
        </div>
    </div>

    <!-- Dashboard Screen -->
    <div id="dashboard-screen" class="hidden h-screen flex">
        <!-- Sidebar -->
        <div class="w-64 bg-white border-r border-ink/10 flex flex-col">
            <div class="p-6 border-b border-ink/10">
                <h1 class="text-xl font-serif font-semibold">Medshine Admin</h1>
            </div>
            <nav class="flex-1 p-4 space-y-2">
                <button data-view="dashboard" class="nav-btn w-full text-left px-4 py-2 rounded-lg bg-ink/5 text-ink font-medium transition-colors">Dashboard</button>
                <button data-view="pages" class="nav-btn w-full text-left px-4 py-2 rounded-lg hover:bg-ink/5 text-inkmute hover:text-ink transition-colors">Pages</button>
                <button data-view="blogs" class="nav-btn w-full text-left px-4 py-2 rounded-lg hover:bg-ink/5 text-inkmute hover:text-ink transition-colors">Blogs</button>
            </nav>
            <div class="p-4 border-t border-ink/10">
                <button id="logout-btn" class="w-full text-left px-4 py-2 rounded-lg text-red-600 hover:bg-red-50 transition-colors font-medium">Logout</button>
            </div>
        </div>

        <!-- Main Content Area -->
        <main class="flex-1 bg-cream/50 overflow-y-auto">
            
            <!-- View: Dashboard -->
            <div id="view-dashboard" class="p-8 view-section">
                <h2 class="text-2xl font-serif font-semibold mb-6">Welcome Back</h2>
                <p class="text-inkmute">Select an option from the sidebar to start managing your website.</p>
            </div>

            <!-- View: Pages -->
            <div id="view-pages" class="p-8 view-section hidden">
                <div class="flex justify-between items-center mb-6">
                    <h2 class="text-2xl font-serif font-semibold">Pages</h2>
                </div>
                
                <div class="grid grid-cols-1 md:grid-cols-3 gap-6">
                    <!-- Pages List -->
                    <div class="md:col-span-1 bg-white rounded-2xl shadow-sm border border-ink/10 p-4">
                        <div id="pages-list" class="space-y-2">
                            <!-- Injected by JS -->
                        </div>
                    </div>
                    
                    <!-- Page Editor -->
                    <div class="md:col-span-2 bg-white rounded-2xl shadow-sm border border-ink/10 p-6 hidden" id="page-editor-container">
                        <h3 class="text-lg font-semibold mb-4" id="page-editor-title">Edit Page</h3>
                        <form id="page-form" class="space-y-4">
                            <input type="hidden" id="edit-page-slug">
                            <div id="page-fields-container" class="space-y-4">
                                <!-- Dynamic Fields Injected Here -->
                            </div>
                            <div class="pt-4 border-t border-ink/10">
                                <button type="submit" id="save-page-btn" class="bg-ink text-white px-6 py-2 rounded-lg hover:bg-inkmute transition-colors font-medium">Save Changes</button>
                            </div>
                        </form>
                    </div>
                </div>
            </div>

            <!-- View: Blogs -->
            <div id="view-blogs" class="p-8 view-section hidden h-full flex flex-col">
                <div class="grid grid-cols-1 md:grid-cols-3 gap-6 flex-1 min-h-0">
                    <!-- Blog List -->
                    <div class="md:col-span-1 bg-white rounded-2xl shadow-sm border border-ink/10 p-6 flex flex-col min-h-0">
                        <div class="flex justify-between items-center mb-4 shrink-0">
                            <h2 class="text-lg font-semibold">Blog Posts</h2>
                            <button id="new-post-btn" class="text-sm bg-ink/10 text-ink px-3 py-1 rounded hover:bg-ink/20 transition-colors">+ New</button>
                        </div>
                        <div id="posts-list" class="flex-1 overflow-y-auto space-y-2 pr-2">
                            <div class="text-inkmute text-sm text-center py-4">Loading posts...</div>
                        </div>
                    </div>

                    <!-- Blog Editor -->
                    <div class="md:col-span-2 bg-white rounded-2xl shadow-sm border border-ink/10 p-6 flex flex-col min-h-0">
                        <h2 id="editor-title" class="text-lg font-semibold mb-4 shrink-0">Create New Post</h2>
                        <form id="post-form" class="flex-1 flex flex-col min-h-0">
                            <input type="hidden" id="post-id">
                            <div class="space-y-4 flex-1 overflow-y-auto pr-2 pb-4">
                                <div>
                                    <label class="block text-sm font-medium mb-1">Title</label>
                                    <input type="text" id="post-title" required class="w-full px-4 py-2 rounded-lg border border-ink/20 focus:outline-none focus:border-ink bg-transparent">
                                </div>
                                <div class="grid grid-cols-2 gap-4">
                                    <div>
                                        <label class="block text-sm font-medium mb-1">Category</label>
                                        <input type="text" id="post-category" required placeholder="e.g. Skin Care" class="w-full px-4 py-2 rounded-lg border border-ink/20 focus:outline-none focus:border-ink bg-transparent">
                                    </div>
                                    <div>
                                        <label class="block text-sm font-medium mb-1">Read Time</label>
                                        <input type="text" id="post-readtime" required placeholder="e.g. 5 Min Read" class="w-full px-4 py-2 rounded-lg border border-ink/20 focus:outline-none focus:border-ink bg-transparent">
                                    </div>
                                </div>
                                <div>
                                    <label class="block text-sm font-medium mb-1">Image URL</label>
                                    <div class="flex gap-2">
                                        <input type="text" id="post-image" required placeholder="e.g. /assets/treatment.jpg or URL" class="flex-1 px-4 py-2 rounded-lg border border-ink/20 focus:outline-none focus:border-ink bg-transparent">
                                        <button type="button" onclick="document.getElementById('file-upload-input').click()" class="px-4 py-2 bg-ink/10 text-ink rounded-lg font-medium hover:bg-ink/20 transition-colors">Upload</button>
                                    </div>
                                </div>
                                <div class="flex-1 flex flex-col min-h-[300px]">
                                    <label class="block text-sm font-medium mb-1">Content (Markdown or Plain Text)</label>
                                    <textarea id="post-content" required class="w-full flex-1 p-4 rounded-lg border border-ink/20 focus:outline-none focus:border-ink bg-transparent resize-none"></textarea>
                                </div>
                            </div>
                            <div class="flex justify-end gap-3 pt-4 border-t border-ink/10 shrink-0 mt-auto">
                                <button type="button" id="delete-btn" class="hidden px-4 py-2 rounded-lg border border-red-200 text-red-600 hover:bg-red-50 transition-colors font-medium">Delete</button>
                                <button type="submit" id="save-btn" class="bg-ink text-white px-6 py-2 rounded-lg hover:bg-inkmute transition-colors font-medium">Publish Post</button>
                            </div>
                        </form>
                    </div>
                </div>
            </div>

        </main>
    </div>

    <!-- Hidden File Input for Uploads -->
    <input type="file" id="file-upload-input" class="hidden" accept="image/*,video/mp4">

    <script type="module" src="/src/admin.js"></script>
</body>
</html>
